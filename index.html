<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rachel Leslie</title>
<meta name="description" content="Rachel Leslie. Official links." />
<link rel="icon" type="image/png" href="assets/logos/fanvue.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1f1f24;
    --muted: rgba(31,31,36,0.65);
    --glass: rgba(255,255,255,0.55);
    --glass-strong: rgba(255,255,255,0.72);
    --border: rgba(255,255,255,0.65);
    --accent: #e879a8;
    --accent-dark: #c45889;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: #000 url('assets/photos/bg.jpg') center/cover no-repeat;
    background-position: center 35%;
    min-height: 100vh;
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Light fade overlay — softens the photo for readability without
     hiding it. Strongest at the top (behind the name) and bottom
     (so the card lifts visually), softer through the middle so the
     photo stays visible. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,0.55) 0%,
        rgba(255,255,255,0.30) 30%,
        rgba(255,255,255,0.30) 60%,
        rgba(255,255,255,0.45) 100%);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  .name {
    margin: 0 0 6px;
    font-family: 'Dancing Script', 'Snell Roundhand', cursive;
    font-weight: 600;
    font-size: 56px;
    letter-spacing: 0.005em;
    text-align: center;
    line-height: 1;
    color: var(--ink);
    text-shadow: 0 2px 18px rgba(255,255,255,0.55);
  }

  .card {
    width: min(440px, calc(100% - 32px));
    margin-top: 18px;
    padding: 18px;
    border-radius: 24px;
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid var(--border);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.85) inset,
      0 20px 50px -16px rgba(0,0,0,0.25),
      0 40px 80px -30px rgba(0,0,0,0.30);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    background: var(--glass-strong);
    border: 1px solid rgba(255,255,255,0.55);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow: 0 2px 8px -2px rgba(0,0,0,0.10);
  }
  a.link:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.92);
    box-shadow: 0 8px 20px -4px rgba(0,0,0,0.18);
  }
  a.link .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: white;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    overflow: hidden;
    box-shadow: 0 2px 6px -2px rgba(0,0,0,0.15);
  }
  a.link .logo img { width: 28px; height: 28px; object-fit: contain; }
  a.link .label { flex: 1; text-align: left; }
  a.link .arrow { color: var(--muted); flex: 0 0 auto; }

  /* Fanvue stays the primary accent — but soft pink, not neon */
  a.link.primary {
    background: linear-gradient(135deg, #f7a8c5, var(--accent));
    border: 1px solid rgba(255,255,255,0.70);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.85) inset,
      0 8px 20px -6px rgba(232,121,168,0.45);
  }
  a.link.primary:hover {
    background: linear-gradient(135deg, #f8b4cd, #ed87b1);
  }
  a.link.primary .logo { background: rgba(255,255,255,0.85); }
</style>
</head>
<body>

<div class="wrap">
  <h1 class="name">Rachel Leslie</h1>

  <div class="card">
    <nav class="links" aria-label="Social links">
      <a class="link primary" href="https://fanvue.com/rachelleslie" target="_blank" rel="noopener">
        <span class="logo"><img src="assets/logos/fanvue-256.png" alt="Fanvue" /></span>
        <span class="label">Fanvue</span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="link" href="https://instagram.com/therachelleslie" target="_blank" rel="noopener">
        <span class="logo"><img src="assets/logos/instagram-256.png" alt="Instagram" /></span>
        <span class="label">Instagram</span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="link" href="https://bsky.app/profile/therachelleslie.bsky.social" target="_blank" rel="noopener">
        <span class="logo"><img src="assets/logos/bsky-256.png" alt="Bluesky" /></span>
        <span class="label">Bluesky</span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </nav>
  </div>
</div>

</body>
</html>
