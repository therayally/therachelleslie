<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rachel Leslie</title>
<meta name="description" content="Rachel Leslie. Official links." />
<link rel="icon" type="image/png" href="assets/logos/fanvue.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    background: #1a1416 url('assets/photos/bg.jpg') center/cover no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Soft dark scrim so the white outlines stay readable.
     Keeps the watercolor visible but slightly toned. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(26,20,22,0.55) 0%,
        rgba(26,20,22,0.30) 25%,
        rgba(26,20,22,0.30) 65%,
        rgba(26,20,22,0.70) 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Banner at the top. */
  .banner {
    position: relative;
    z-index: 2;
    width: 100%;
    height: clamp(220px, 38vw, 460px);
    background: #000 url('assets/photos/banner.jpg') center/cover no-repeat;
    display: block;
  }

  /* Soft fade under the banner into the watercolor. */
  .banner-fade {
    height: 48px;
    background: linear-gradient(180deg, rgba(26,20,22,0.55) 0%, rgba(26,20,22,0.0) 100%);
    margin-top: -2px;
    position: relative;
    z-index: 1;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 460px;
    margin: 0 auto;
    padding: 16px 20px 28px;
    text-align: center;
  }

  /* Short bio above the buttons. */
  .bio {
    margin: 0 0 22px;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Big, see-through white-outlined boxes. */
  a.link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px 20px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.85);
    color: #fff;
    text-decoration: none;
    font-family: 'Helvetica Neue', Helvetica, 'Inter', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    box-shadow: 0 6px 20px -8px rgba(0,0,0,0.4);
  }
  a.link .logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: transparent;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    overflow: hidden;
  }
  a.link .logo img { width: 24px; height: 24px; object-fit: contain; }
  a.link .label { flex: 0 1 auto; }

  a.link:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -8px rgba(0,0,0,0.5);
  }

  /* ----- About Me section at the bottom ----- */
  .about {
    position: relative;
    z-index: 2;
    padding: 40px 24px 32px;
    text-align: center;
  }
  .about .heading {
    font-family: 'Cormorant Garamond', 'Snell Roundhand', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: 56px;
    line-height: 1.2;
    color: #fff;
    margin: 0 0 18px;
    padding-top: 0.15em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .about .body {
    color: rgba(255,255,255,0.92);
    font-size: 15px;
    line-height: 1.65;
    margin: 0 auto 22px;
    max-width: 360px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  }
  .about .ask {
    font-family: 'Cormorant Garamond', 'Snell Roundhand', Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: 36px;
    line-height: 1.3;
    color: #fff;
    margin: 8px 0 0;
    padding-top: 0.15em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .about .heart {
    display: inline-block;
    margin-left: 6px;
    transform: translateY(6px);
    color: #ff7aa8;
    vertical-align: middle;
  }

  .footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 8px 16px 28px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    font-family: 'Helvetica Neue', Helvetica, 'Inter', sans-serif;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="banner" role="img" aria-label="Rachel Leslie"></div>

<div class="banner-fade"></div>

<div class="wrap">
  <p class="bio">Sharing my world, one photo at a time.</p>

  <nav class="links" aria-label="Social links">
    <a class="link" href="https://fanvue.com/rachelleslie" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/fanvue-256.png" alt="Fanvue" /></span>
      <span class="label">Fanvue</span>
    </a>
    <a class="link" href="https://instagram.com/therachelleslie" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/instagram-256.png" alt="Instagram" /></span>
      <span class="label">Instagram</span>
    </a>
    <a class="link" href="https://bsky.app/profile/therachelleslie.bsky.social" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/bsky-256.png" alt="Bluesky" /></span>
      <span class="label">Bluesky</span>
    </a>
    <a class="link" href="https://www.facebook.com/profile.php?id=61594489410522" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/facebook-256.png" alt="Facebook" /></span>
      <span class="label">Facebook</span>
    </a>
  </nav>
</div>

<section class="about">
  <h2 class="heading">About Me</h2>
  <p class="body">Thanks for stopping by. Every share, like, and subscribe means the world to me and lets me keep creating the kind of content you came here for.</p>
  <p class="ask">Please consider spoiling me <span class="heart">&hearts;</span></p>
</section>

<div class="footer">2026 Rachel Leslie</div>

</body>
</html>
