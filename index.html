<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rachel Leslie</title>
<meta name="description" content="Rachel Leslie. Official links." />
<link rel="icon" type="image/png" href="assets/logos/fanvue.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1f1f24;
    --muted: rgba(31,31,36,0.55);
    --glass-strong: rgba(255,255,255,0.78);
    --border: rgba(255,255,255,0.65);
    --accent: #e879a8;
    --page-bg: #f4e8e0;            /* warm cream pulled from the banner */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--page-bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* The banner image, full-width at the top.
     Uses object-fit so it crops cleanly on any screen. */
  .banner {
    width: 100%;
    height: clamp(220px, 38vw, 460px);
    background: #000 url('assets/photos/banner.jpg') center/cover no-repeat;
    display: block;
  }

  /* Soft fade under the banner into the page bg. */
  .banner-fade {
    height: 28px;
    background: linear-gradient(180deg, rgba(244,232,224,0), var(--page-bg));
    margin-top: -2px;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 8px 18px 40px;
  }

  .card {
    padding: 14px;
    border-radius: 22px;
    background: var(--glass-strong);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.90) inset,
      0 14px 40px -16px rgba(0,0,0,0.18);
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.85);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow: 0 2px 8px -2px rgba(0,0,0,0.08);
  }
  a.link:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.98);
    box-shadow: 0 8px 20px -4px rgba(0,0,0,0.16);
  }
  a.link .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: white;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    overflow: hidden;
    box-shadow: 0 2px 6px -2px rgba(0,0,0,0.15);
  }
  a.link .logo img { width: 28px; height: 28px; object-fit: contain; }
  a.link .label { flex: 1; text-align: left; }
  a.link .arrow { color: var(--muted); flex: 0 0 auto; }

  /* Fanvue — soft pink primary */
  a.link.primary {
    background: linear-gradient(135deg, #f7a8c5, var(--accent));
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.85) inset,
      0 8px 22px -6px rgba(232,121,168,0.45);
  }
  a.link.primary:hover {
    background: linear-gradient(135deg, #f8b4cd, #ed87b1);
  }
  a.link.primary .logo { background: rgba(255,255,255,0.92); }

  .footer {
    text-align: center;
    padding: 24px 16px 32px;
    color: var(--muted);
    font-size: 11.5px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div class="banner" role="img" aria-label="Rachel Leslie"></div>
<div class="banner-fade"></div>

<div class="wrap">
  <div class="card">
    <nav class="links" aria-label="Social links">
      <a class="link primary" href="https://fanvue.com/rachelleslie" target="_blank" rel="noopener">
        <span class="logo"><img src="assets/logos/fanvue-256.png" alt="Fanvue" /></span>
        <span class="label">Fanvue</span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="link" href="https://instagram.com/therachelleslie" target="_blank" rel="noopener">
        <span class="logo"><img src="assets/logos/instagram-256.png" alt="Instagram" /></span>
        <span class="label">Instagram</span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="link" href="https://bsky.app/profile/therachelleslie.bsky.social" target="_blank" rel="noopener">
        <span class="logo"><img src="assets/logos/bsky-256.png" alt="Bluesky" /></span>
        <span class="label">Bluesky</span>
        <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </nav>
  </div>
</div>

<div class="footer">2026 Rachel Leslie</div>

</body>
</html>
