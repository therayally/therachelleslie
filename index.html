<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rachel Leslie</title>
<meta name="description" content="Rachel Leslie. Official links." />
<link rel="icon" type="image/png" href="assets/logos/fanvue.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    background: #1a1416 url('assets/photos/bg.jpg') center/cover no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Soft dark scrim so the white button outlines stay readable.
     Keeps the watercolor visible but slightly toned. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(26,20,22,0.55) 0%,
        rgba(26,20,22,0.30) 25%,
        rgba(26,20,22,0.30) 65%,
        rgba(26,20,22,0.70) 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Banner at the top, z-index above the scrim. */
  .banner {
    position: relative;
    z-index: 2;
    width: 100%;
    height: clamp(220px, 38vw, 460px);
    background: #000 url('assets/photos/banner.jpg') center/cover no-repeat;
    display: block;
  }

  /* Soft fade under the banner into the watercolor. */
  .banner-fade {
    height: 48px;
    background: linear-gradient(180deg, rgba(26,20,22,0.55) 0%, rgba(26,20,22,0.0) 100%);
    margin-top: -2px;
    position: relative;
    z-index: 1;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 20px 28px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Big, see-through white-outlined boxes. The background watercolor shows
     through them — that's the whole look. */
  a.link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px 20px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.85);
    color: #fff;
    text-decoration: none;
    font-family: 'Helvetica Neue', Helvetica, 'Inter', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    box-shadow: 0 6px 20px -8px rgba(0,0,0,0.4);
  }
  a.link .logo {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: transparent;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    overflow: hidden;
  }
  a.link .logo img { width: 24px; height: 24px; object-fit: contain; }
  a.link .label { flex: 0 1 auto; }

  a.link:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -8px rgba(0,0,0,0.5);
  }

  .footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 8px 16px 28px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    font-family: 'Helvetica Neue', Helvetica, 'Inter', sans-serif;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="banner" role="img" aria-label="Rachel Leslie"></div>

<div class="banner-fade"></div>

<div class="wrap">
  <nav class="links" aria-label="Social links">
    <a class="link" href="https://fanvue.com/rachelleslie" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/fanvue-256.png" alt="Fanvue" /></span>
      <span class="label">Fanvue</span>
    </a>
    <a class="link" href="https://instagram.com/therachelleslie" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/instagram-256.png" alt="Instagram" /></span>
      <span class="label">Instagram</span>
    </a>
    <a class="link" href="https://bsky.app/profile/therachelleslie.bsky.social" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/bsky-256.png" alt="Bluesky" /></span>
      <span class="label">Bluesky</span>
    </a>
    <a class="link" href="https://www.facebook.com/profile.php?id=61594489410522" target="_blank" rel="noopener">
      <span class="logo"><img src="assets/logos/facebook-256.png" alt="Facebook" /></span>
      <span class="label">Facebook</span>
    </a>
  </nav>
</div>

<div class="footer">2026 Rachel Leslie</div>

</body>
</html>
